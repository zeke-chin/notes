<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- User-only trial. Keep the system's Noto fonts installed. -->
  <!-- This source splits styles into families and marks every weight regular.
       Normalize only these exact source family names; leave font files intact. -->
  <match target="scan">
    <test name="family" compare="eq"><string>PingFangSC-Regular</string></test>
    <edit name="family" mode="assign"><string>PingFang SC</string></edit>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
  <match target="scan">
    <test name="family" compare="eq"><string>PingFangSC-Medium</string></test>
    <edit name="family" mode="assign"><string>PingFang SC</string></edit>
    <edit name="weight" mode="assign"><const>medium</const></edit>
  </match>
  <match target="scan">
    <test name="family" compare="eq"><string>PingFangSC-Semibold</string></test>
    <edit name="family" mode="assign"><string>PingFang SC</string></edit>
    <edit name="weight" mode="assign"><const>demibold</const></edit>
  </match>
  <match target="scan">
    <test name="family" compare="eq"><string>PingFangSC-Light</string></test>
    <edit name="family" mode="assign"><string>PingFang SC</string></edit>
    <edit name="weight" mode="assign"><const>light</const></edit>
  </match>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>PingFang SC</family>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans Symbols 2</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>SF Mono</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Symbols 2</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>SF Pro Text</family>
    <accept>
      <family>PingFang SC</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans Symbols 2</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
  <alias binding="same">
    <family>SF Mono</family>
    <accept>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Symbols 2</family>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
